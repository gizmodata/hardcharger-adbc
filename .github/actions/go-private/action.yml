name: Read the private Go module
description: >
  Lets the Go toolchain fetch github.com/gizmodata/chargewire-adbc over SSH with a read-only
  deploy key of that repository, while that repository is private. No personal token.
inputs:
  deploy-key:
    description: The CHARGEWIRE_ADBC_DEPLOY_KEY secret (private key of a read-only deploy key)
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DEPLOY_KEY: ${{ inputs.deploy-key }}
      run: |
        if [ -z "$DEPLOY_KEY" ]; then
          echo "::error::the CHARGEWIRE_ADBC_DEPLOY_KEY secret is not set: the private key of a read-only deploy key of gizmodata/chargewire-adbc"
          exit 1
        fi
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/chargewire_adbc
        chmod 600 ~/.ssh/chargewire_adbc
        git config --global url."ssh://git@github.com/gizmodata/chargewire-adbc".insteadOf "https://github.com/gizmodata/chargewire-adbc"
        echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/chargewire_adbc -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
        echo "GOPRIVATE=github.com/gizmodata/*" >> "$GITHUB_ENV"

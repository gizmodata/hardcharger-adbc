name: ci

# Every suite, on every push and pull request; also the release gate (release.yml calls it on
# the tagged commit):
#   - Go: gofmt, vet, unit tests and the live-server suite, with the race detector;
#   - the C shared library, its exports (only Adbc*, go/internal/checkexports), its glibc ceiling,
#     and the Python bindings' unit and live tests, on Python 3.10 with exactly the lowest
#     dependency versions python/pyproject.toml allows, and on 3.14 and 3.15 with the latest;
#   - the README's C (through the ADBC driver manager and the manifest) and Go examples, run
#     against a server on the default port;
#   - the library and Python unit tests on macOS and Windows;
#   - the ADBC Driver Foundry's validation (conformance) suite, validation/, against a server.
#
# hardcharger-server comes from the image ghcr.io/gizmodata/hardcharger, pulled with this
# workflow's GITHUB_TOKEN (no personal token); the package grants this repository read access
# (package settings, Manage Actions access). The Go module dependencies are public.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server the live suites run against: hardcharger's main branch, which CI publishes on
  # every green push (:main, and :sha-<short> for a fixed build). The suites need a server from
  # 3fbd36b or later (table functions re-read on each execution); the 0.2.0 release predates it.
  # :main rather than a pinned :sha- so the driver keeps up with the server it ships beside; pin a
  # :sha- here to reproduce an old run.
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main
  # The last server released before the protocol's rename: the live suites check that the driver
  # still works with it (HARDCHARGER_ADBC_TEST_LEGACY_*; those tests fail, not skip, once set).
  HARDCHARGER_LEGACY_IMAGE: ghcr.io/gizmodata/hardcharger:2.2.0
  # The ADBC C driver manager for the C example (apache/arrow-adbc release).
  ARROW_ADBC_TAG: apache-arrow-adbc-25

jobs:
  # Decides whether this run is about code (code=true) or documentation only (code=false). Every
  # other job needs it and runs only when code=true; "CI result" at the end is the one required
  # check. code=false only when every changed file is *.md, docs/**, LICENSE, NOTICE or
  # .github/ISSUE_TEMPLATE/** (workflow files are code). Tags, workflow_dispatch, schedule and any
  # other event (including release.yml calling this workflow, which carries the caller's tag push
  # or dispatch) always test everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Code or documentation only?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          code=true
          range=
          case "$EVENT:$REF" in
            *:refs/tags/*) reason="a tag ($REF)" ;;
            pull_request:*) range="$PR_BASE...$SHA" ;;
            push:refs/heads/*)
              if [ -z "$BEFORE" ] || [ -z "${BEFORE//0/}" ]; then
                reason="a new branch"
              elif ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                reason="the previous head $BEFORE is not in the history (force push)"
              else
                range="$BEFORE..$SHA"
              fi
              ;;
            *) reason="a $EVENT run on $REF" ;;
          esac
          if [ -n "$range" ]; then
            # --no-renames: a rename lists both paths, so moving code into docs/ is still code.
            files=$(git diff --no-renames --name-only "$range")
            count=0
            code=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              count=$((count + 1))
              case "$f" in
                *.md | docs/* | LICENSE | NOTICE | .github/ISSUE_TEMPLATE/*) echo "docs: $f" ;;
                *) echo "code: $f"; code=true ;;
              esac
            done <<< "$files"
            if [ "$count" -eq 0 ]; then
              code=true
              reason="no changed files in $range"
            elif [ "$code" = true ]; then
              reason="code changed in $range"
            else
              reason="only documentation changed in $range ($count files)"
            fi
          fi
          echo "code=$code ($reason)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "**Changes:** code=\`$code\` ($reason)" >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Go, Python ${{ matrix.python }} and examples (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor, installed with exactly the lowest versions python/pyproject.toml
        # allows (uv's lowest-direct resolution; the floors are dlt's, see the comments next to
        # them). 3.14 also runs the Go live suite, the notices check and the README examples.
        # 3.15 is the newest Python, with the latest versions.
        include:
          - python: "3.10"
            resolution: lowest-direct
          - python: "3.14"
            resolution: highest
          - python: "3.15"
            resolution: highest
    steps:
      - uses: actions/checkout@v7
      - name: PyPI description mirrors the repository README
        run: scripts/sync_python_readme.sh --check
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ github.token }}
      - name: A server from before the rename
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 12):p@ss"
          echo "::add-mask::$password"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker run -d --name hardcharger-legacy -p 127.0.0.1:31400:31337 \
            -e HARDCHARGER_ADMIN_PASSWORD="$password" "$HARDCHARGER_LEGACY_IMAGE" >/dev/null
          docker logout ghcr.io >/dev/null
          # Any HTTP answer means it is up; the tests check that the driver can use it.
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:31400/ && break; sleep 1; done
          curl -s -o /dev/null http://127.0.0.1:31400/
          {
            echo "HARDCHARGER_ADBC_TEST_LEGACY_URI=hardcharger://127.0.0.1:31400?tls=false"
            echo "HARDCHARGER_ADBC_TEST_LEGACY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: gofmt and vet
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go vet -tags integration ./...
      - name: Go unit tests
        working-directory: go
        run: make test
      # The Go packages are pure Go: a program that imports them must build with CGO_ENABLED=0
      # and cross-compile (a Grafana backend plugin is built that way for every platform). Only
      # the C shared library (pkg/hardcharger) needs cgo. 2.5.0 and earlier did not build
      # without it (the Chargewire driver named arrow-go's cgo-only allocator).
      - name: The Go driver and its example build, cross-compile and pass their unit tests without cgo
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 windows/amd64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build ./hardcharger/ ./examples/...
          done
          go vet ./hardcharger/ ./examples/...
          go test ./hardcharger/
      - name: Third-party notices are current (scripts/third_party_notices.sh)
        if: matrix.python == '3.14'
        run: scripts/third_party_notices.sh --check
      # Fails without the server, and when no integration test ran.
      - name: Go live suite (race detector)
        if: matrix.python == '3.14'
        working-directory: go
        run: make integration-test

      - name: Build the shared library
        run: scripts/build_lib.sh
      - name: The library exports only the ADBC entrypoints (Adbc*)
        working-directory: go
        run: go run ./internal/checkexports build/libadbc_driver_hardcharger.so
      - name: Check the glibc ceiling (2.17)
        run: scripts/check_glibc.sh go/build/libadbc_driver_hardcharger.so

      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the Python package (${{ matrix.resolution }} versions)
        working-directory: python
        run: |
          uv venv .venv --python "${{ matrix.python }}"
          uv pip install --python .venv/bin/python --resolution "${{ matrix.resolution }}" -e ".[test,dev]"
          uv pip list --python .venv/bin/python
      # The lowest entry fails when what got installed is not the floors, so the floors can't
      # drift from what is tested.
      - name: What is installed is exactly the floors in pyproject.toml
        if: matrix.resolution == 'lowest-direct'
        working-directory: python
        run: |
          set -euo pipefail
          for package in adbc-driver-manager pyarrow; do
            floor=$(sed -n "s/^ *\"$package>=\([0-9.]*\)\".*/\1/p" pyproject.toml)
            have=$(uv pip show --python .venv/bin/python "$package" | sed -n 's/^Version: //p')
            echo "$package: floor ${floor:-none found}, installed ${have:-nothing}"
            if [ -z "$floor" ] || [ "$floor" != "$have" ]; then
              echo "::error::$package: pyproject.toml's floor is '${floor}', but '${have}' is installed"
              exit 1
            fi
          done
          have=$(.venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          floor=$(sed -n 's/^requires-python = ">=\([0-9.]*\)".*/\1/p' pyproject.toml)
          echo "python: floor ${floor:-none found}, running $have"
          if [ -z "$floor" ] || [ "$floor" != "$have" ]; then
            echo "::error::requires-python's floor is '${floor}', but this job runs Python $have"
            exit 1
          fi
      # Lint with the latest ruff only: the lowest entry has the oldest ruff the dev extra allows.
      - name: Python lint
        if: matrix.resolution == 'highest'
        working-directory: python
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Python tests (unit and live, against the built library)
        working-directory: python
        run: .venv/bin/python -m pytest -v -rs

      # The README's examples, as written: a server on the default port 31337 with the
      # README's credentials, the driver found by name through the manifest.
      - name: Build the ADBC C driver manager
        if: matrix.python == '3.14'
        run: |
          git clone -q --depth 1 --branch "$ARROW_ADBC_TAG" https://github.com/apache/arrow-adbc.git "$RUNNER_TEMP/arrow-adbc"
          cmake -S "$RUNNER_TEMP/arrow-adbc/c" -B "$RUNNER_TEMP/adbc-build" -DCMAKE_BUILD_TYPE=Release \
            -DADBC_DRIVER_MANAGER=ON -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/adbc" >/dev/null
          cmake --build "$RUNNER_TEMP/adbc-build" -j 4 >/dev/null
          cmake --install "$RUNNER_TEMP/adbc-build" >/dev/null
      - name: README examples (C through the driver manager, Go)
        if: matrix.python == '3.14'
        run: |
          set -euo pipefail
          readme="$RUNNER_TEMP/readme"
          mkdir -p "$readme"
          # Started directly in its directory (its database file lands there), not as a
          # backgrounded `cd && server` subshell, so $! is the server's PID.
          (
            cd "$readme" || exit 1
            env -i PATH="$PATH" HARDCHARGER_ADMIN_PASSWORD=change-me \
              "$HARDCHARGER_ADBC_TEST_SERVER_BINARY" --print-queries false > "$readme/server.log" 2>&1 &
            echo $! > "$readme/server.pid"
          )
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:31337/chargewire && break; sleep 1; done
          pid=$(cat "$readme/server.pid")
          [ "$(readlink -f "/proc/$pid/exe")" = "$(readlink -f "$HARDCHARGER_ADBC_TEST_SERVER_BINARY")" ] || { echo "::error::server.pid ($pid) is not hardcharger-server"; exit 1; }
          python/.venv/bin/python -m adbc_driver_hardcharger.manifest --dir "$RUNNER_TEMP/manifests"
          cc -Wall examples/c/hello.c -I"$RUNNER_TEMP/adbc/include" -L"$RUNNER_TEMP/adbc/lib" \
            -ladbc_driver_manager -Wl,-rpath,"$RUNNER_TEMP/adbc/lib" -o "$RUNNER_TEMP/hello"
          ADBC_DRIVER_PATH="$RUNNER_TEMP/manifests" "$RUNNER_TEMP/hello" | tee c.out
          grep -qx 'answer = 42' c.out
          (cd go && go run ./examples/hello) | tee go.out
          grep -q 'col\[0\]\[answer\]: \[42\]' go.out

  # The ADBC Driver Foundry's validation suite (validation/; pinned in validation/requirements.txt),
  # against a server whose catalog is `validation`, through the library built as for a release.
  # It fails, never skips, without its server; the first run proves that on every build. The
  # server runs with TZ=UTC: the suite expects TIMESTAMPTZ as timestamp[tz=UTC], and DuckDB's
  # TimeZone otherwise follows the runner's /etc/localtime (Etc/UTC).
  validation:
    name: ADBC validation suite (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ github.token }}
      - name: Build the shared library
        run: scripts/build_lib.sh
      - name: The library exports only the ADBC entrypoints (Adbc*)
        working-directory: go
        run: go run ./internal/checkexports build/libadbc_driver_hardcharger.so
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the suite (Python 3.14)
        working-directory: validation
        run: |
          uv venv .venv --python 3.14
          uv pip install --python .venv/bin/python -r requirements.txt
      - name: The suite fails when its server is unreachable
        working-directory: validation
        env:
          HARDCHARGER_ADBC_TEST_URI: hardcharger://127.0.0.1:9?tls=false
          HARDCHARGER_ADBC_TEST_USERNAME: nobody
          HARDCHARGER_ADBC_TEST_PASSWORD: nothing
        run: |
          # The step's shell is bash -e: the expected failure is tested in a condition.
          if .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_connection.py > unreachable.log 2>&1; then
            cat unreachable.log
            echo "::error::the suite passed without a server"
            exit 1
          fi
          tail -3 unreachable.log
          if ! grep -q "can't reach the server at hardcharger://127.0.0.1:9" unreachable.log; then
            cat unreachable.log
            echo "::error::the suite failed for another reason"
            exit 1
          fi
      - name: Start a server for the suite
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 12):p@ss"
          echo "::add-mask::$password"
          dir="$RUNNER_TEMP/validation"
          mkdir -p "$dir"
          # The server itself is the background job (env execs it, so $! is its PID), not a
          # subshell around `cd && server`; it runs until the job ends (the runner stops it).
          cd "$dir" || exit 1
          env -i PATH="$PATH" HOME="$dir" \
            TZ=UTC HARDCHARGER_ADMIN_PASSWORD="$password" "$HARDCHARGER_ADBC_TEST_SERVER_BINARY" \
            --host 127.0.0.1 --port 31470 --health-port 0 --admin-username hc_adbc_validation \
            --database "$dir/validation.duckdb" --print-queries false \
            > "$dir/server.log" 2>&1 &
          echo $! > "$dir/server.pid"
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:31470/chargewire && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:31470/chargewire
          # The recorded PID is the server's own process.
          pid=$(cat "$dir/server.pid")
          exe=$(readlink -f "/proc/$pid/exe")
          [ "$exe" = "$(readlink -f "$HARDCHARGER_ADBC_TEST_SERVER_BINARY")" ] || { echo "::error::server.pid ($pid) is $exe, not hardcharger-server"; exit 1; }
          echo "hardcharger-server is PID $pid"
          {
            echo "HARDCHARGER_ADBC_TEST_URI=hardcharger://127.0.0.1:31470?tls=false"
            echo "HARDCHARGER_ADBC_TEST_USERNAME=hc_adbc_validation"
            echo "HARDCHARGER_ADBC_TEST_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Run the suite
        working-directory: validation
        run: .venv/bin/python -m pytest -p no:cacheprovider -rfEsxX --junit-xml=validation-report.xml
      - name: Server log
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/validation/server.log" ]; then tail -100 "$RUNNER_TEMP/validation/server.log"; else echo "no server was started"; fi

  platforms:
    name: library and Python unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Go unit tests
        shell: bash
        working-directory: go
        run: go test ./...
      - name: Build the shared library
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: scripts/build_lib.sh
      - name: The library exports only the ADBC entrypoints (Adbc*)
        shell: bash
        working-directory: go
        run: |
          case "$RUNNER_OS" in macOS) ext=dylib ;; Windows) ext=dll ;; *) ext=so ;; esac
          go run ./internal/checkexports "build/libadbc_driver_hardcharger.$ext"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Python unit tests (against the built library)
        shell: bash
        working-directory: python
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -v -m "not integration"

  # The one required status check. It fails when any job failed or was cancelled, and when the
  # change is code but a job that must run was skipped; for a documentation-only change the
  # skipped jobs pass. Jobs in OPTIONAL skip by their own conditions (tag-only publishing).
  ci-result:
    name: CI result
    if: always()
    needs: [changes, linux, validation, platforms]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or was skipped for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          OPTIONAL: ""
        run: |
          set -euo pipefail
          changes=$(jq -r '.changes.result' <<< "$NEEDS")
          if [ "$changes" != success ] || { [ "$CODE" != true ] && [ "$CODE" != false ]; }; then
            echo "::error::the Changes job didn't decide (result: $changes, code: '$CODE')"
            exit 1
          fi
          failed=0
          while read -r job result; do
            optional=false
            for o in $OPTIONAL; do if [ "$o" = "$job" ]; then optional=true; fi; done
            case "$result" in
              success) echo "ok       $job" ;;
              skipped)
                if [ "$CODE" = true ] && [ "$optional" = false ]; then
                  echo "::error::$job was skipped, but this change is code: it must run"
                  failed=1
                else
                  echo "skipped  $job"
                fi
                ;;
              *) echo "::error::$job: $result"; failed=1 ;;
            esac
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$failed"

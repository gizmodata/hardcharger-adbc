name: ci

# Every suite, on every push and pull request; also the release gate (release.yml calls it on
# the tagged commit):
#   - Go: gofmt, vet, unit tests and the live-server suite, with the race detector;
#   - the C shared library, its glibc ceiling, and the Python bindings' unit and live tests;
#   - the README's C (through the ADBC driver manager and the manifest) and Go examples, run
#     against a server on the default port;
#   - the library and Python unit tests on macOS and Windows.
#
# hardcharger-server comes from the image ghcr.io/gizmodata/hardcharger, pulled with this
# workflow's GITHUB_TOKEN (no personal token); the package grants this repository read access
# (package settings, Manage Actions access). The Go module dependencies are public.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # The server the live suites run against: hardcharger's main branch, which CI publishes on
  # every green push (:main, and :sha-<short> for a fixed build). The suites need a server from
  # 3fbd36b or later (table functions re-read on each execution); the 0.2.0 release predates it.
  # :main rather than a pinned :sha- so the driver keeps up with the server it ships beside; pin a
  # :sha- here to reproduce an old run.
  HARDCHARGER_IMAGE: ghcr.io/gizmodata/hardcharger:main
  # The last server released before the protocol's rename: the live suites check that the driver
  # still works with it (HARDCHARGER_ADBC_TEST_LEGACY_*; those tests fail, not skip, once set).
  HARDCHARGER_LEGACY_IMAGE: ghcr.io/gizmodata/hardcharger:2.2.0
  # The ADBC C driver manager for the C example (apache/arrow-adbc release).
  ARROW_ADBC_TAG: apache-arrow-adbc-24

jobs:
  linux:
    name: Go, Python ${{ matrix.python }} and examples (linux)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: PyPI description mirrors the repository README
        run: scripts/sync_python_readme.sh --check
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: ./.github/actions/hardcharger-server
        with:
          image: ${{ env.HARDCHARGER_IMAGE }}
          token: ${{ github.token }}
      - name: A server from before the rename
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 12):p@ss"
          echo "::add-mask::$password"
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker run -d --name hardcharger-legacy -p 127.0.0.1:31400:31337 \
            -e HARDCHARGER_ADMIN_PASSWORD="$password" "$HARDCHARGER_LEGACY_IMAGE" >/dev/null
          docker logout ghcr.io >/dev/null
          # Any HTTP answer means it is up; the tests check that the driver can use it.
          for _ in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:31400/ && break; sleep 1; done
          curl -s -o /dev/null http://127.0.0.1:31400/
          {
            echo "HARDCHARGER_ADBC_TEST_LEGACY_URI=hardcharger://127.0.0.1:31400?tls=false"
            echo "HARDCHARGER_ADBC_TEST_LEGACY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: gofmt and vet
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go vet -tags integration ./...
      - name: Go unit tests
        working-directory: go
        run: make test
      - name: Third-party notices are current (scripts/third_party_notices.sh)
        if: matrix.python == '3.14'
        run: scripts/third_party_notices.sh --check
      # Fails without the server, and when no integration test ran.
      - name: Go live suite (race detector)
        if: matrix.python == '3.14'
        working-directory: go
        run: make integration-test

      - name: Build the shared library
        run: scripts/build_lib.sh
      - name: Check the glibc ceiling (2.17)
        run: scripts/check_glibc.sh go/build/libadbc_driver_hardcharger.so

      - uses: astral-sh/setup-uv@v10.3.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Python lint and tests (unit and live, against the built library)
        working-directory: python
        run: |
          uv venv .venv --python "${{ matrix.python }}"
          uv pip install --python .venv/bin/python -e ".[test,dev]"
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
          .venv/bin/python -m pytest -v

      # The README's examples, as written: a server on the default port 31337 with the
      # README's credentials, the driver found by name through the manifest.
      - name: Build the ADBC C driver manager
        if: matrix.python == '3.14'
        run: |
          git clone -q --depth 1 --branch "$ARROW_ADBC_TAG" https://github.com/apache/arrow-adbc.git "$RUNNER_TEMP/arrow-adbc"
          cmake -S "$RUNNER_TEMP/arrow-adbc/c" -B "$RUNNER_TEMP/adbc-build" -DCMAKE_BUILD_TYPE=Release \
            -DADBC_DRIVER_MANAGER=ON -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/adbc" >/dev/null
          cmake --build "$RUNNER_TEMP/adbc-build" -j 4 >/dev/null
          cmake --install "$RUNNER_TEMP/adbc-build" >/dev/null
      - name: README examples (C through the driver manager, Go)
        if: matrix.python == '3.14'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/readme"
          (cd "$RUNNER_TEMP/readme" && env -i PATH="$PATH" HARDCHARGER_ADMIN_PASSWORD=change-me \
            "$HARDCHARGER_ADBC_TEST_SERVER_BINARY" --print-queries false > server.log 2>&1 &)
          for _ in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:31337/chargewire && break; sleep 1; done
          python/.venv/bin/python -m adbc_driver_hardcharger.manifest --dir "$RUNNER_TEMP/manifests"
          cc -Wall examples/c/hello.c -I"$RUNNER_TEMP/adbc/include" -L"$RUNNER_TEMP/adbc/lib" \
            -ladbc_driver_manager -Wl,-rpath,"$RUNNER_TEMP/adbc/lib" -o "$RUNNER_TEMP/hello"
          ADBC_DRIVER_PATH="$RUNNER_TEMP/manifests" "$RUNNER_TEMP/hello" | tee c.out
          grep -qx 'answer = 42' c.out
          (cd go && go run ./examples/hello) | tee go.out
          grep -q 'col\[0\]\[answer\]: \[42\]' go.out

  platforms:
    name: library and Python unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Go unit tests
        shell: bash
        working-directory: go
        run: go test ./...
      - name: Build the shared library
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: scripts/build_lib.sh
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Python unit tests (against the built library)
        shell: bash
        working-directory: python
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -v -m "not integration"
